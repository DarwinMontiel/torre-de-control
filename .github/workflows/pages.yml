# Publica la demo del tablero en GitHub Pages: la torre completa corre en el navegador
# sobre el simulador de "la noche del cierre". No hay backend.
name: Demo en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['src/tablero/**', 'src/dominio/**', 'vite.config.ts', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/demo
      - id: despliegue
        uses: actions/deploy-pages@v5
