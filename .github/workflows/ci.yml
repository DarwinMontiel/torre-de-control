name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Tipos · Lint · Pruebas (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipado estricto
        run: npm run typecheck
      - name: ESLint + Prettier
        run: npm run lint
      - name: Pruebas con cobertura (umbral 95 % líneas)
        run: npm run test:cobertura
      - name: Build del tablero (en vivo y demo)
        run: npm run build && npm run build:demo
      - uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/lcov.info

  sdk-python:
    name: SDK Python · ruff · mypy · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: pip install -e ".[dev]" pika==1.3.2
      - run: ruff check . && ruff format --check .
      - run: ruff check ../../simulador && ruff format --check ../../simulador
      - run: mypy
      - run: pytest --cov

  integracion:
    name: Integración · PostgreSQL + Redis + RabbitMQ
    runs-on: ubuntu-latest
    needs: calidad
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: torre
          POSTGRES_PASSWORD: torre
          POSTGRES_DB: torre
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U torre" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ['5672:5672', '15672:15672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integracion

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v7
      - name: Construir API, tablero y simulador
        run: docker compose build
