[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "torre-sdk"
version = "1.0.0"
description = "SDK mínimo para que un bot RPA reporte latidos y eventos a la Torre de Control."
readme = "README.md"
license = "MIT"
authors = [{ name = "Darwin Montiel Mora" }]
requires-python = ">=3.11"
# Sin dependencias: solo biblioteca estándar, para instalarlo sin fricción en servidores Windows.
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torre_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["torre_sdk"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "ejemplos"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF", "N", "PL"]
# N818: en español el sufijo va al inicio (ErrorTorre). RUF001-003: tildes y signos del español.
ignore = ["PLR0913", "N818", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "PLR2004", "S310"]
"ejemplos/**" = ["S311", "PLR2004"]
